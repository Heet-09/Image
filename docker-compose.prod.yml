version: "3.9"

services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: cbir_db
      MYSQL_USER: user
      MYSQL_PASSWORD: password
      MYSQL_ROOT_PASSWORD: rootpassword
    volumes:
      - mysql_data_prod:/var/lib/mysql

  web:
    build: .
    command: gunicorn --workers=1 --worker-class=sync --worker-connections=1000 --timeout=300 --max-requests=1000 --max-requests-jitter=50 --graceful-timeout=30 --bind 0.0.0.0:8000 cbir_project.wsgi:application
    ports:
    - "8000:8000"    
    volumes:
      - .:/app
    depends_on:
      - db
    environment:
      MYSQL_DATABASE: cbir_db
      MYSQL_USER: user
      MYSQL_PASSWORD: password
      MYSQL_HOST: db
      MYSQL_PORT: 3306
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1.5G

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - .:/app
    depends_on:
      - web

volumes:
  mysql_data_prod:
